# Runtime trackball tuning behavior (roBaish Studio)
# param1 = PMW_RT_* action number, see drivers/pmw3610/src/pmw3610_runtime.h

description: Adjust PMW3610 trackball settings at runtime

compatible: "zmk,behavior-pmw3610-config"

properties:
  label:
    type: string
    required: false
  "#binding-cells":
    type: int
    required: true
    const: 1

binding-cells:
  - param1
